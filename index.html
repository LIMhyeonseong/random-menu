<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랜덤 메뉴 추천</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <h1>오늘 뭐 먹지?</h1>
        <p class="intro-text">버튼을 누르면 랜덤으로 메뉴를 추천해드립니다.</p>

        <div class="option-area">
            <div class="option-box">
                <p class="option-title">아래의 메뉴 카테고리 중 고르거나,</p>

                <div class="button-group category-group">
                    <button class="option-button category-button" data-category="한식">한식</button>
                    <button class="option-button category-button" data-category="중식">중식</button>
                    <button class="option-button category-button" data-category="일식">일식</button>
                    <button class="option-button category-button" data-category="양식">양식</button>
                    <button class="option-button category-button" data-category="분식">분식</button>
                    <button class="option-button category-button" data-category="패스트푸드">패스트푸드</button>
                    <button class="option-button category-button" data-category="아시안">아시안</button>
                    <button class="option-button category-button" data-category="기타">기타</button>
                    <button class="option-button category-button active" data-category="전체">전체 선택</button>
                </div>
            </div>

            <div class="option-box">
                <p class="option-title">아니면 간단하게 정해보세요!</p>

                <div class="button-group type-group">
                    <button class="option-button type-button" data-type="가벼운 메뉴">가벼운 메뉴</button>
                    <button class="option-button type-button" data-type="든든한 메뉴">든든한 메뉴</button>
                    <button class="option-button type-button active" data-type="전체">아무거나 추천해주세요</button>
                </div>
            </div>
        </div>

        <button id="recommendButton" class="recommend-button">랜덤 메뉴 추천하기</button>
    </div>

    <div id="resultOverlay" class="result-overlay hidden">
    <div class="result-modal">
        <button id="closeResultBtn" class="result-close-btn" type="button">×</button>
        <p class="result-label">오늘의 추천 메뉴</p>
        <h2 id="resultMenuName" class="result-menu-name">메뉴 이름</h2>
        <p id="resultMenuCategory" class="result-menu-category">카테고리</p>
        <p id="resultMenuDescription" class="result-menu-description">
            메뉴 설명
        </p>
    </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
